<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 포트폴리오</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">MY LOGO</div>
            <ul class="nav-menu">
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="hamburger" aria-label="메뉴 열기">☰</button>
            <button class="theme-toggle" aria-label="다크모드 전환">🌙</button>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>안녕하세요, 저는 윤정민입니다.</h1>
            <p>AI 기술과 서비스 기획 사이에서 방향을 찾아가고 있는 학생입니다.</p>
            <a href="#projects">View Projects</a>
            <a href="#contact">Contact</a>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>자기소개 문구를 여기에 작성하세요.</p>
        </section>

        <section id="skills">
            <h2>Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <section id="projects">
            <h2>Projects</h2>
            <div class="projects-grid">
                <!-- GitHub API로 여기에 자동으로 카드가 채워질 예정 -->
            </div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <form class="contact-form" novalidate>
                <label for="name">이름</label>
                <input type="text" id="name" name="name">
                <span class="error-msg" id="name-error"></span>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email">
                <span class="error-msg" id="email-error"></span>

                <label for="message">메시지</label>
                <textarea id="message" name="message"></textarea>
                <span class="error-msg" id="message-error"></span>

                <button type="submit">보내기</button>
                <p class="success-msg" id="success-msg"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 윤정민</p>
        <a href="https://github.com/yj-min-i">GitHub</a>
    </footer>

    <button class="scroll-top-btn" aria-label="맨 위로">↑</button>
</body>
</html>
